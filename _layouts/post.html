---
layout: default
---
<article class="panel post">
	<header class="postHeader">
		<h1>{{ page.title }}</h1>
		<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
	</header>

	<div class="postContent">
		{{ content }}
	</div>

	<nav class="postNav">
		<a class="button" href="{{ '/' | relative_url }}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> All entries</a>
	</nav>
</article>
